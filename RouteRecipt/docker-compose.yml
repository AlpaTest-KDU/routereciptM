version: "3.8"

services:
  mariadb:
    image: mariadb:11.4
    container_name: routerecipt-mariadb
    restart: always

    # ⭐ 핵심: .env 명시적 연결
    env_file:
      - .env

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: routereciptdb
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - routerecipt-net

  redis:
    image: redislabs/rebloom:latest
    container_name: routerecipt-redis
    restart: always
    networks:
      - routerecipt-net

  fastapi-ai:
    image: localhost/routereciptd_fastapi-ai:latest
    container_name: routerecipt-fastapi-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - routerecipt-net

  springboot-blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/routereciptd_springboot:blue
    container_name: routerecipt-springboot-blue
    depends_on:
      - mariadb
      - redis

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: blue
      SPRING_DATASOURCE_URL: jdbc:mariadb://routerecipt-mariadb:3306/routereciptdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: routerecipt-redis
      SPRING_DATA_REDIS_PORT: 6379

    networks:
      - routerecipt-net

  springboot-green:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/routereciptd_springboot:green
    container_name: routerecipt-springboot-green
    depends_on:
      - mariadb
      - redis

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: green
      SPRING_DATASOURCE_URL: jdbc:mariadb://routerecipt-mariadb:3306/routereciptdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: routerecipt-redis
      SPRING_DATA_REDIS_PORT: 6379

    networks:
      - routerecipt-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: routerecipt-nginx
    container_name: routerecipt-nginx
    ports:
      - "80:80"
    depends_on:
      - springboot-blue
      - springboot-green
    networks:
      - routerecipt-net

volumes:
  mariadb_data:

networks:
  routerecipt-net:
    driver: bridge 
