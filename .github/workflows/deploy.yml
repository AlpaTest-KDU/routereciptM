name: Build & Deploy (Blue-Green)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔽 여기서 JAR을 러너로 가져옴
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: RouteRecipt

      - name: Deploy only
        working-directory: RouteRecipt
        run: |
          chmod +x deploy.sh
          ./deploy.sh
