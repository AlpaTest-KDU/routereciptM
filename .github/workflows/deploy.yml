name: RouteRecipt CI (Docker Build)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write   # ⭐ 이게 핵심

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        working-directory: RouteRecipt
        shell: bash
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/routereciptd_springboot:latest
          echo "Building image: $IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE
