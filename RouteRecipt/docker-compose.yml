version: "3.8"

services:
  mariadb:
    image: mariadb:11.4
    container_name: routerecipt-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: routereciptdb
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - routerecipt-net

  redis:
    image: redislabs/rebloom:latest
    container_name: routerecipt-redis
    restart: always
    networks:
      - routerecipt-net

  fastapi-ai:
    image: localhost/routereciptd_fastapi-ai:latest
    container_name: routerecipt-fastapi-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - routerecipt-net

  springboot-blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/routereciptd_springboot:blue
    container_name: routerecipt-springboot-blue
    environment:
      SPRING_PROFILES_ACTIVE: blue

      # DB
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}

      # Redis
      SPRING_DATA_REDIS_HOST: routerecipt-redis
      SPRING_DATA_REDIS_PORT: 6379

      # AI / OCR
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_CATEGORY_URL: ${AI_CATEGORY_URL}
      CLOVA_URL: ${CLOVA_URL}
      CLOVA_SECRET: ${CLOVA_SECRET}
    networks:
      - routerecipt-net

  springboot-green:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/routereciptd_springboot:green
    container_name: routerecipt-springboot-green
    environment:
      SPRING_PROFILES_ACTIVE: green

      # DB
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}

      # Redis
      SPRING_DATA_REDIS_HOST: routerecipt-redis
      SPRING_DATA_REDIS_PORT: 6379

      # AI / OCR
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_CATEGORY_URL: ${AI_CATEGORY_URL}
      CLOVA_URL: ${CLOVA_URL}
      CLOVA_SECRET: ${CLOVA_SECRET}
    networks:
      - routerecipt-net

  nginx:
    image: nginx:1.25-alpine
    container_name: routerecipt-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - routerecipt-net

volumes:
  mariadb_data:

networks:
  routerecipt-net:
    driver: bridge
