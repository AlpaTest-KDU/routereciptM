name: RouteRecipt CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Podman Image
        working-directory: RouteRecipt
        run: |
          podman build -t localhost/routereciptd_springboot:latest .

      - name: Deploy (Blue/Green)
        working-directory: RouteRecipt
        run: |
          chmod +x deploy.sh
          ./deploy.sh
