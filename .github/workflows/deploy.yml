name: RouteRecipt CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x deploy.sh switch-nginx.sh

      - name: Run deploy script
        run: ./deploy.sh
