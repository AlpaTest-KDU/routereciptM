name: RouteRecipt CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, routerecipt]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload JAR to Deploy Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: RouteRecipt/build/libs/RouteRecipt-0.0.1-SNAPSHOT.jar
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Execute deploy.sh on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            chmod +x deploy.sh switch-nginx.sh
            ./deploy.sh
