name: RouteRecipt CI (Docker Build)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest   # ← 핵심: self-hosted 필요 없음

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker 빌드 환경 준비
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker 로그인 (GitHub Container Registry 예시)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이미지 빌드 & 푸시
      - name: Build and Push Image
        working-directory: RouteRecipt
        run: |
          docker build -t ghcr.io/AlpaTest-KDU/routereciptd_springboot:latest .
          docker push ghcr.io/AlpaTest-KDU/routereciptd_springboot:latest
