name: RouteRecipt CI (Docker Build)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ GHCR 로그인
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4️⃣ 이미지 빌드 & 푸시 (⭐ 소문자 변환 핵심)
      - name: Build and Push Image
        working-directory: RouteRecipt
        shell: bash
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/routereciptd_springboot:latest
          echo "Building image: $IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE
