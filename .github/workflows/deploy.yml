name: RouteRecipt CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Podman 상태 정리 (환경별 안전 처리)
      - name: Prepare Podman
        shell: bash
        run: |
          set +e
          podman machine ls >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "▶ Podman machine detected. Restarting..."
            podman machine stop || true
            podman machine start || true
          else
            echo "▶ Podman machine not in use. Skipping machine restart."
          fi
          set -e

      # 3️⃣ Build Image
      - name: Build Podman Image
        working-directory: RouteRecipt
        run: |
          podman build -t localhost/routereciptd_springboot:latest .

      # 4️⃣ Deploy (Blue/Green)
      - name: Deploy (Blue/Green)
        working-directory: RouteRecipt
        run: |
          chmod +x deploy.sh
          ./deploy.sh
