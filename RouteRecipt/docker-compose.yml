version: "3.8"

services:
  # ======================================================
  # MariaDB
  # ======================================================
  mariadb:
    image: mariadb:11.4
    container_name: routerecipt-mariadb
    restart: always
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: routereciptdb
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - routerecipt-net

  # ======================================================
  # Redis (RedisBloom 포함)
  # ======================================================
  redis:
    image: redislabs/rebloom:latest
    container_name: routerecipt-redis
    restart: always
    networks:
      - routerecipt-net

  # ======================================================
  # FastAPI AI
  # ======================================================
  fastapi-ai:
    image: localhost/routereciptd_fastapi-ai:latest
    container_name: routerecipt-fastapi-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - routerecipt-net

  # ======================================================
  # Spring Boot - Blue (ACTIVE)
  # ======================================================
  springboot-blue:
    image: localhost/routereciptd_springboot:latest
    container_name: routerecipt-springboot-blue
    restart: always
    env_file:
      - .env
    ports:
      - "8090:8090"
    environment:
      SPRING_DATA_REDIS_HOST: routerecipt-redis
      SPRING_DATA_REDIS_PORT: 6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 2s
      retries: 12
      start_period: 20s
    depends_on:
      - mariadb
      - redis
      - fastapi-ai
    networks:
      - routerecipt-net

  # ======================================================
  # Spring Boot - Green (INACTIVE → 배포 대상)
  # ======================================================
  springboot-green:
    image: localhost/routereciptd_springboot:latest
    container_name: routerecipt-springboot-green
    restart: always
    env_file:
      - .env
    ports:
      - "8091:8090"
    environment:
      SPRING_DATA_REDIS_HOST: routerecipt-redis
      SPRING_DATA_REDIS_PORT: 6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 2s
      retries: 12
      start_period: 20s
    depends_on:
      - mariadb
      - redis
      - fastapi-ai
    networks:
      - routerecipt-net

  # ======================================================
  # Nginx (Reverse Proxy / Blue-Green Entry Point)
  # ======================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: localhost/routereciptd_nginx:latest
    container_name: routerecipt-nginx
    restart: always

    # ⭐⭐⭐ 핵심: HOST → NGINX 포트 바인딩
    ports:
      - "80:80"

    depends_on:
      - springboot-blue
      - springboot-green
    networks:
      - routerecipt-net

  # ======================================================
  # Cloudflare Tunnel (외부 진입점)
  # ======================================================
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    container_name: routerecipt-cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/creds.json:/etc/cloudflared/creds.json:ro
    depends_on:
      - nginx
    networks:
      - routerecipt-net

volumes:
  mariadb_data:

networks:
  routerecipt-net:
    driver: bridge
