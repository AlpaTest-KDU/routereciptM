name: Build & Deploy (Blue-Green)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        working-directory: RouteRecipt
        run: |
          echo "🧹 기존 .env 삭제"
          rm -f .env

          echo "📝 새 .env 생성"
          printf "%s\n" \
          "LANG=C.UTF-8" \
          "MARIADB_ROOT_PASSWORD=${{ secrets.MARIADB_ROOT_PASSWORD }}" \
          "DB_USER=${{ secrets.DB_USER }}" \
          "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
          "" \
          "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
          "AI_CATEGORY_URL=${{ secrets.AI_CATEGORY_URL }}" \
          "CLOVA_URL=${{ secrets.CLOVA_URL }}" \
          "CLOVA_SECRET=${{ secrets.CLOVA_SECRET }}" \
          > .env

          echo "📄 .env 내용 확인"
          nl -ba .env

      - name: Deploy only
        working-directory: RouteRecipt
        run: |
          chmod +x deploy.sh
          ./deploy.sh
