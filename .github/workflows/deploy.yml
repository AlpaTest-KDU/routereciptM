name: Build & Deploy (Blue-Green)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy only
        working-directory: RouteRecipt
        run: |
          chmod +x deploy.sh
          ./deploy.sh
