name: RouteRecipt CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Spring Boot JAR
        run: |
          ./gradlew clean bootJar

      - name: Build Podman Image
        run: |
          podman build -t localhost/routereciptd_springboot:latest .

      - name: Deploy (Blue/Green)
        run: |
          ./deploy.sh
